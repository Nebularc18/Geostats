services:
  postgres:
    image: imresamu/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    # S3-compatible object storage (amd64 + arm64). Replaces MinIO, whose
    # community Docker images were discontinued upstream.
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/api:${GEOSTATS_IMAGE_TAG:-dockhand}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command:
      [
        "node",
        "packages/db/node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema",
        "packages/db/prisma/schema.prisma"
      ]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/api:${GEOSTATS_IMAGE_TAG:-dockhand}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COLLECTOR_TOKEN_ENCRYPTION_KEY: ${COLLECTOR_TOKEN_ENCRYPTION_KEY:?Set COLLECTOR_TOKEN_ENCRYPTION_KEY}
      API_ORIGIN: ${API_ORIGIN:?Set API_ORIGIN}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-${WEB_ORIGIN:?Set WEB_ORIGIN}}
      AUTH_MODE: ${AUTH_MODE:-clerk}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-dev@local.geostats}
      DEV_AUTH_USERNAME: ${DEV_AUTH_USERNAME:-dev}
      DEV_AUTH_CREATE_PROFILE: ${DEV_AUTH_CREATE_PROFILE:-true}
      DEV_AUTH_GC_USERNAME: ${DEV_AUTH_GC_USERNAME:-dev}
      DEV_AUTH_TIME_ZONE: ${DEV_AUTH_TIME_ZONE:-Europe/Stockholm}
      API_PORT: 3001
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/worker:${GEOSTATS_IMAGE_TAG:-dockhand}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:?Set S3_REGION}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      IMPORT_WORKER_CONCURRENCY: ${IMPORT_WORKER_CONCURRENCY:-2}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/web:${GEOSTATS_IMAGE_TAG:-dockhand}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-clerk}
      NEXT_PUBLIC_AUTH_PROVIDER_NAME: ${NEXT_PUBLIC_AUTH_PROVIDER_NAME:-Clerk}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_DEV_AUTO_LOGIN: ${NEXT_PUBLIC_DEV_AUTO_LOGIN:-false}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:
