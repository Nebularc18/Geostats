name: Web runtime configuration

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web-runtime-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm --filter @geostats/web --filter @geostats/shared install --frozen-lockfile
      - run: pnpm --filter @geostats/web exec playwright install --with-deps chromium
      - run: pnpm --filter @geostats/shared build
      - run: pnpm --filter @geostats/web test
      - run: pnpm --filter @geostats/web test:runtime-browser
