name: Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create timestamp release tag
        id: release
        shell: bash
        run: echo "tag=release-$(date -u +%Y%m%d-%H%M%S)-utc" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build and push api
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      job-name-prefix: Build and push api
      output: image
      push: true
      sign: "false"
      context: .
      file: apps/api/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: api
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}/api
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=${{ needs.release-tag.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
        type=sha,prefix=sha-
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-worker:
    name: Build and push worker
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      job-name-prefix: Build and push worker
      output: image
      push: true
      sign: "false"
      context: .
      file: apps/worker/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: worker
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}/worker
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=${{ needs.release-tag.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
        type=sha,prefix=sha-
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build and push web
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      job-name-prefix: Build and push web
      output: image
      push: true
      sign: "false"
      context: .
      file: apps/web/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: web
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}/web
      meta-tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=${{ needs.release-tag.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
        type=sha,prefix=sha-
      build-args: |
        NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
        NEXT_PUBLIC_AUTH_MODE=${{ vars.NEXT_PUBLIC_AUTH_MODE || 'clerk' }}
        NEXT_PUBLIC_AUTH_PROVIDER_NAME=${{ vars.NEXT_PUBLIC_AUTH_PROVIDER_NAME || 'Clerk' }}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || '' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
