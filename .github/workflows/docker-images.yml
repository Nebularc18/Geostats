name: Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Create timestamp release tag
        id: release
        shell: bash
        run: echo "tag=release-$(date -u +%Y%m%d-%H%M%S)-utc" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build and push api
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      job-name-prefix: Build and push api
      output: image
      push: true
      sign: "false"
      context: .
      file: apps/api/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: api
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}/api
      meta-tags: |
        type=sha,prefix=sha-
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-worker:
    name: Build and push worker
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      job-name-prefix: Build and push worker
      output: image
      push: true
      sign: "false"
      context: .
      file: apps/worker/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: worker
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}/worker
      meta-tags: |
        type=sha,prefix=sha-
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build and push web
    needs: release-tag
    uses: docker/github-builder/.github/workflows/build.yml@3415a188caae9a0da7fba83bc06985776e0b1790 # v1
    permissions:
      contents: read
      packages: write
    with:
      job-name-prefix: Build and push web
      output: image
      push: true
      sign: "false"
      context: .
      file: apps/web/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: web
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}/web
      meta-tags: |
        type=sha,prefix=sha-
      build-args: |
        NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
        NEXT_PUBLIC_AUTH_MODE=${{ vars.NEXT_PUBLIC_AUTH_MODE || 'clerk' }}
        NEXT_PUBLIC_AUTH_PROVIDER_NAME=${{ vars.NEXT_PUBLIC_AUTH_PROVIDER_NAME || 'Clerk' }}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || '' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish matching release images
    needs: [release-tag, build-api, build-worker, build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release tags, then latest
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WORKER_DIGEST: ${{ needs.build-worker.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/${IMAGE_REPOSITORY,,}"
          services=(api worker web)
          digests=("$API_DIGEST" "$WORKER_DIGEST" "$WEB_DIGEST")

          # Validate every build output before publishing any release tags.
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid image digest: $digest"
              exit 1
            fi
          done

          # Promote immutable build outputs, never a mutable SHA tag.
          for tag in "$RELEASE_TAG" latest; do
            for i in "${!services[@]}"; do
              docker buildx imagetools create \
                --tag "$image_prefix/${services[$i]}:$tag" \
                "$image_prefix/${services[$i]}@${digests[$i]}"
            done
          done

          # Only advertise the release after all promotions have succeeded.
          {
            echo "## Ready to deploy"
            echo
            echo "All three images were published with the shared tag: $RELEASE_TAG"
            echo
            echo '```bash'
            echo "export GEOSTATS_IMAGE_PREFIX=$image_prefix"
            echo "export GEOSTATS_IMAGE_TAG=$RELEASE_TAG"
            echo 'docker compose pull api worker web'
            echo 'docker compose up -d --no-build'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
