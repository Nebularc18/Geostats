name: Android APK startup smoke test
description: Launch an APK with Maestro and preserve startup logs and screenshots.
inputs:
  apk_path:
    description: Absolute path to the APK
    required: true
  output_directory:
    description: Directory for test reports and logcat
    required: true
runs:
  using: composite
  steps:
    - name: Use Java 17
      shell: bash
      run: |
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
    - name: Install pinned Maestro CLI
      shell: bash
      run: |
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip --output maestro.zip
        curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/checksums_sha256.txt --output checksums_sha256.txt
        sha256sum --check --ignore-missing checksums_sha256.txt
        unzip -q maestro.zip -d maestro-cli
        echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
    - name: Enable KVM for the test runner
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run startup test on Android
      uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
      env:
        APK_PATH: ${{ inputs.apk_path }}
        SMOKE_OUTPUT: ${{ inputs.output_directory }}
        MAESTRO_CLI_NO_ANALYTICS: '1'
      with:
        api-level: 35
        target: google_apis
        arch: x86_64
        # Emulator 37.3.10 went offline during the app relaunch. Use the verified 37.2.13 build.
        emulator-build: '16740729'
        disable-animations: true
        script: bash apps/mobile/e2e/run-startup-smoke.sh
    - name: Upload startup logs and screenshots
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: android-startup-results
        path: ${{ inputs.output_directory }}
        if-no-files-found: warn
