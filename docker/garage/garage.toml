# Geostats Garage single-node config (amd64 + arm64).
# Secrets are NOT stored here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN
# come from the container environment (see docker-compose.yml).
# Region must stay us-east-1 to match S3_REGION in .env examples.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
