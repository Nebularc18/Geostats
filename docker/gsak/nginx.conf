server {
  listen 80;
  server_name _;

  # Docker's embedded DNS can move a service to a new container IP when it is
  # recreated. Resolve the API at request time instead of keeping nginx's
  # startup-time address cached.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  client_max_body_size 3m;

  location = /collector/gsak/import {
    set $gsak_api_upstream http://api:3001;
    proxy_pass $gsak_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
