services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-geostats-imports}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${S3_BUCKET};
      "

  migrate:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/api:${GEOSTATS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: >
      sh -c "
      for attempt in $$(seq 1 30); do
        node packages/db/node_modules/prisma/build/index.js migrate deploy --schema packages/db/prisma/schema.prisma && exit 0;
        echo \"Migration attempt $$attempt failed; retrying...\";
        sleep 2;
      done;
      exit 1
      "
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/api:${GEOSTATS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COLLECTOR_TOKEN_ENCRYPTION_KEY: ${COLLECTOR_TOKEN_ENCRYPTION_KEY:?Set COLLECTOR_TOKEN_ENCRYPTION_KEY in .env}
      API_ORIGIN: ${API_ORIGIN:?Set API_ORIGIN in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-${WEB_ORIGIN:?Set WEB_ORIGIN in .env}}
      AUTH_MODE: ${AUTH_MODE:-password}
      EXTERNAL_AUTH_PROVIDER_ID: ${EXTERNAL_AUTH_PROVIDER_ID:-home-auth}
      EXTERNAL_AUTH_CLIENT_ID: ${EXTERNAL_AUTH_CLIENT_ID:-}
      EXTERNAL_AUTH_CLIENT_SECRET: ${EXTERNAL_AUTH_CLIENT_SECRET:-}
      EXTERNAL_AUTH_REQUIRE_VERIFIED_EMAIL: ${EXTERNAL_AUTH_REQUIRE_VERIFIED_EMAIL:-true}
      EXTERNAL_AUTH_AUTHORIZE_URL: ${EXTERNAL_AUTH_AUTHORIZE_URL:-}
      EXTERNAL_AUTH_TOKEN_URL: ${EXTERNAL_AUTH_TOKEN_URL:-}
      EXTERNAL_AUTH_USERINFO_URL: ${EXTERNAL_AUTH_USERINFO_URL:-}
      EXTERNAL_AUTH_CALLBACK_URL: ${EXTERNAL_AUTH_CALLBACK_URL:-http://localhost:3001/auth/external/callback}
      DEV_AUTH_EMAIL: ${DEV_AUTH_EMAIL:-dev@local.geostats}
      DEV_AUTH_USERNAME: ${DEV_AUTH_USERNAME:-dev}
      DEV_AUTH_CREATE_PROFILE: ${DEV_AUTH_CREATE_PROFILE:-true}
      DEV_AUTH_GC_USERNAME: ${DEV_AUTH_GC_USERNAME:-dev}
      DEV_AUTH_TIME_ZONE: ${DEV_AUTH_TIME_ZONE:-Europe/Stockholm}
      API_PORT: ${API_PORT:-3001}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/worker:${GEOSTATS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: ${GEOSTATS_IMAGE_PREFIX:-geostats}/web:${GEOSTATS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-password}
        NEXT_PUBLIC_AUTH_PROVIDER_NAME: ${NEXT_PUBLIC_AUTH_PROVIDER_NAME:-Home Auth}
        NEXT_PUBLIC_DEV_AUTO_LOGIN: ${NEXT_PUBLIC_DEV_AUTO_LOGIN:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
